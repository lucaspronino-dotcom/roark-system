services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: roark
      POSTGRES_DB: db_roark_prod
    ports:
      - "5432:5432"
    volumes:
      - data_roark_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db_roark_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roark_app

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://admin:roark@postgres:5432/db_roark_prod"
      PORT: "3000"
    expose:
      - "3000"
    networks:
      roark_app:
        aliases:
          - roark_prod_api

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        VITE_API_URL: "https://app.roark.uno/api"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/entrypoint.sh:/docker-entrypoint.d/90-roark-certbot-watch.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - roark_app
      - roark_dev

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh
    command: >
      -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path /var/www/certbot --deploy-hook "date > /var/www/certbot/.reload-nginx"; sleep 12h & wait $$!; done'

networks:
  roark_app:
    name: roark_app
  roark_dev:
    name: roark_dev
    external: true

volumes:
  data_roark_prod:
    name: data_roark_prod
    external: true
  letsencrypt:
  certbot_webroot:
