map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name app.roark.uno;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name app.roark.uno;

  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api_upstream roark_prod_api:3000;

  ssl_certificate /etc/letsencrypt/live/app.roark.uno/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.roark.uno/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location ~ /\.(?!well-known) {
    return 404;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}


server {
  listen 80;
  listen [::]:80;
  server_name dev.roark.uno;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  resolver 127.0.0.11 valid=30s ipv6=off;
  set $dev_web_upstream roark_dev_web:5173;
  set $dev_api_upstream roark_dev_api:3000;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$dev_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://$dev_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
